[project]
name = "stagent"
dynamic = ["version"]
description = "Spatial transcriptomics cell type annotation driven by natural-language spatial priors"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "pyarrow", "matplotlib",
  "tifffile", "zarr>=3", "imagecodecs", "h5py", "mcp>=1.9,<2", "uvicorn",
  # the annotation's neighbor search and clustering: pinned, because another version gives other neighbors and
  # clusters (pynndescent 0.6.0 and 0.7.0 differ for a third of the cells), so every installation annotates alike
  "pynndescent==0.7.0", "numba==0.68.1", "igraph==1.0.0",
  "starlette", "pillow", "scikit-learn",
  # UMAP: 0.6 keeps the 0.5 layout with compatibility_layout=True (stagent/embedding.umap_options); 0.7 is to change
  # its default, so it stays below that until checked
  "umap-learn>=0.5.7,<0.7",
  "pydeseq2",  # Compare > DESeq2 (pseudobulk over a project's slices)
  # Harmony (joint embedding of several slices): 2.x is compiled and has no Windows build, so Windows uses
  # stagent/harmony.py, its NumPy version
  "harmonypy; sys_platform != 'win32'",
  # the exact neighbor search on the Apple GPU (Apple silicon, macOS 14 or later = Darwin 23: MLX has no build for
  # older macOS, where the search runs on the CPU, with the same neighbors). Pinned so every build is alike; it pulls
  # mlx-metal (the GPU library and its kernels)
  "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
]

[project.optional-dependencies]
app = ["pywebview>=5"]  # the desktop window (macOS: WebKit through PyObjC)
gpu = ["torch"]  # optional: exact kNN on an NVIDIA / Apple GPU in the marker step

[project.scripts]
stagent = "stagent.cli:main"
celltypeagent = "stagent.cli:main"  # the old name, for installations and app settings that still use it
stagent-mcp = "stagent.mcp_server:main"
stagent-review = "stagent.review_app:main"
stagent-web = "stagent.webapp:main"

[tool.setuptools.dynamic]
version = {attr = "stagent.__version__"}

[build-system]
requires = ["setuptools>=77"]  # 77: license as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stagent"]

[tool.setuptools.package-data]
stagent = ["static/*", "static/vendor/*", "data/*", "data/organs/*", "data/priors/*"]
