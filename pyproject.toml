[project]
name = "stagent"
dynamic = ["version"]
description = "Spatial transcriptomics cell type annotation driven by natural-language spatial priors"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "pyarrow", "matplotlib",
  "tifffile", "zarr>=3", "imagecodecs", "h5py", "mcp>=1.9,<2", "igraph", "pynndescent", "uvicorn",
  "starlette", "pillow", "scikit-learn", "umap-learn",
  # Harmony (joint embedding of several slices): 2.x is compiled and has no Windows build; 0.0.10 is pure Python
  # (same results: correlation 0.999 with 2.1.0 on a test, slower) and needs no PyTorch, unlike 0.1 / 0.2
  "harmonypy; sys_platform != 'win32'", "harmonypy==0.0.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
app = ["pywebview>=5"]  # the desktop window (macOS: WebKit through PyObjC)
gpu = ["torch"]  # optional: exact kNN on an NVIDIA / Apple GPU in the marker step

[project.scripts]
stagent = "stagent.cli:main"
celltypeagent = "stagent.cli:main"  # the old name, for installations and app settings that still use it
stagent-mcp = "stagent.mcp_server:main"
stagent-review = "stagent.review_app:main"
stagent-web = "stagent.webapp:main"

[tool.setuptools.dynamic]
version = {attr = "stagent.__version__"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stagent"]

[tool.setuptools.package-data]
stagent = ["static/*", "static/vendor/*", "data/*", "data/organs/*"]
